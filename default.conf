server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    charset utf-8;

    client_max_body_size 55M;

    location ^~ /public/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ^~ /vendor/twbs/bootstrap-icons/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ^~ /vendor/sweetalert2/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ~* ^/(includes|actions|config|database|storage|tools|pages|templates|src|vendor)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php$is_args$args;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
